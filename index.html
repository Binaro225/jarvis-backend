<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>J.A.R.V.I.S.</title>
  <meta name="theme-color" content="#02060c" />
  <style>
    html, body, #root {
      margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
      background: #02060c; overflow: hidden; font-family: system-ui, -apple-system, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,240,255,0.05); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.3); border-radius: 4px; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function GalaxyCanvas({ nodes = [] }) {
      const mountRef = useRef(null);

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        mount.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const safeNodes = Array.isArray(nodes) && nodes.length > 0 ? nodes : [];

        if (safeNodes.length === 0) {
          // Affichage par défaut si la connexion Drive n'est pas encore faite
          const geometry = new THREE.BufferGeometry();
          const count = 150;
          const positions = new Float32Array(count * 3);
          for (let i = 0; i < count * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 12;
          }
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const material = new THREE.PointsMaterial({ size: 0.04, color: 0x00f0ff });
          group.add(new THREE.Points(geometry, material));
        } else {
          // Génération des planètes et étoiles basée sur les fichiers Google Drive
          safeNodes.forEach((node, i) => {
            const isSheet = node.type === 'spreadsheet' || (node.name && node.name.toLowerCase().includes('sheet'));
            
            // Les Google Sheets deviennent des planètes (sphères), les autres docs des étoiles
            const geometry = isSheet 
              ? new THREE.SphereGeometry(0.18, 16, 16) 
              : new THREE.SphereGeometry(0.08, 8, 8);

            const color = isSheet ? 0x10b981 : 0x00f0ff; // Vert pour Sheets, Cyan pour les autres
            const material = new THREE.MeshBasicMaterial({ color, wireframe: isSheet });

            const mesh = new THREE.Mesh(geometry, material);

            // Disposition en orbite autour du centre
            const angle = (i / safeNodes.length) * Math.PI * 2;
            const radius = 2.5 + (i % 3) * 0.8;
            mesh.position.x = Math.cos(angle) * radius;
            mesh.position.y = (Math.random() - 0.5) * 2;
            mesh.position.z = Math.sin(angle) * radius;

            group.add(mesh);
          });
        }

        camera.position.z = 6;

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          group.rotation.y += 0.002;
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (mount && mount.contains(renderer.domElement)) {
            mount.removeChild(renderer.domElement);
          }
        };
      }, [nodes]);

      return <div ref={mountRef} className="absolute inset-0 z-0 pointer-events-none" />;
    }

    function JarvisApp() {
      const [input, setInput] = useState('');
      const [lastResponse, setLastResponse] = useState('Système prêt.');
      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [galaxyNodes, setGalaxyNodes] = useState([]);
      
      const recognitionRef = useRef(null);
      const isProcessingRef = useRef(false);

      useEffect(() => {
        fetch('/api/galaxy')
          .then(res => res.json())
          .then(data => {
            if (data && data.nodes) setGalaxyNodes(data.nodes);
          })
          .catch(() => {});
      }, []);

      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'fr-FR';
          utterance.onstart = () => setIsSpeaking(true);
          const handleEnd = () => {
            setIsSpeaking(false);
            isProcessingRef.current = false;
          };
          utterance.onend = handleEnd;
          utterance.onerror = handleEnd;
          window.speechSynthesis.speak(utterance);
        } else {
          isProcessingRef.current = false;
        }
      };

      const sendMessage = async (textOverride) => {
        const query = (textOverride !== undefined ? textOverride : input).trim();
        if (!query || isProcessingRef.current) return;

        isProcessingRef.current = true;
        setInput('');
        setLastResponse("Analyse en cours...");

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: query }),
          });

          if (response.ok) {
            const data = await response.json();
            const reply = data.response || "Opération terminée.";
            setLastResponse(reply);
            speak(reply);
          } else {
            setLastResponse("Erreur de communication backend.");
            isProcessingRef.current = false;
          }
        } catch (err) {
          setLastResponse("Erreur réseau.");
          isProcessingRef.current = false;
        }
      };

      const toggleMic = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        if (isListening) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setIsListening(false);
        } else {
          if (isSpeaking) {
            window.speechSynthesis.cancel();
            setIsSpeaking(false);
          }
          const rec = new SpeechRecognition();
          rec.lang = 'fr-FR';
          rec.continuous = false;
          rec.onstart = () => setIsListening(true);
          rec.onresult = (e) => {
            setIsListening(false);
            if (e.results && e.results[0]) sendMessage(e.results[0][0].transcript);
          };
          rec.onerror = () => setIsListening(false);
          rec.onend = () => setIsListening(false);
          recognitionRef.current = rec;
          rec.start();
        }
      };

      return (
        <div className="relative w-full h-screen text-cyan-400 flex flex-col justify-between p-4 z-10 select-none overflow-hidden">
          <GalaxyCanvas nodes={galaxyNodes} />
          
          <header className="z-10 text-center pt-2 flex-shrink-0">
            <h1 className="text-2xl font-bold tracking-[0.3em] text-cyan-300 drop-shadow-[0_0_12px_rgba(0,240,255,0.9)]">
              J.A.R.V.I.S.
            </h1>
            <p className="text-[10px] text-cyan-500 uppercase tracking-widest mt-1">
              {isSpeaking ? "• RÉPONSE EN COURS •" : isListening ? "• ÉCOUTE ACTIVE •" : "• PRÊT •"}
            </p>
          </header>

          <main className="z-10 flex-1 flex flex-col items-center justify-center my-2 px-2 overflow-hidden">
            <div className={`w-20 h-20 flex-shrink-0 rounded-full border border-cyan-500/40 flex items-center justify-center mb-3 transition-all ${
              isSpeaking ? 'scale-110 shadow-[0_0_30px_rgba(0,240,255,0.8)]' : ''
            }`}>
              <div className="w-8 h-8 rounded-full bg-cyan-400 shadow-[0_0_15px_#00f0ff]" />
            </div>

            <div className="w-full max-w-lg max-h-[45vh] overflow-y-auto custom-scroll bg-black/60 backdrop-blur-md border border-cyan-500/20 rounded-2xl p-4 shadow-[0_0_15px_rgba(0,240,255,0.1)]">
              <p className="text-sm font-medium tracking-wide text-cyan-100 leading-relaxed whitespace-pre-wrap">
                {lastResponse}
              </p>
            </div>
          </main>

          <footer className="z-10 w-full max-w-md mx-auto bg-black/70 backdrop-blur-lg border border-cyan-500/30 rounded-full p-2 flex items-center gap-2 flex-shrink-0 mb-2">
            <button 
              onClick={toggleMic}
              className={`p-3 rounded-full border transition-all ${
                isListening ? 'bg-red-500/30 border-red-400 text-red-200 animate-pulse' : 'bg-cyan-950/40 border-cyan-700 text-cyan-400'
              }`}
            >
              🎤
            </button>

            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
              placeholder="Envoyer un message..."
              className="w-full bg-transparent text-cyan-100 placeholder-cyan-600 outline-none px-2 text-sm"
            />

            <button
              onClick={() => sendMessage()}
              className="bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 px-4 py-2 rounded-full text-xs font-semibold uppercase"
            >
              OK
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<JarvisApp />);
  </script>
</body>
</html>
