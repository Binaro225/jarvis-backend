<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        .header {
            margin-top: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 6px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .header p {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #00f0ff;
            opacity: 0.8;
            margin-top: 5px;
        }

        .chat-box {
            width: 90vw;
            max-width: 500px;
            background: rgba(8, 20, 35, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            max-height: 35vh;
            overflow-y: auto;
        }

        .chat-message {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e0f7fc;
            white-space: pre-wrap;
        }

        .input-bar {
            width: 90vw;
            max-width: 500px;
            display: flex;
            align-items: center;
            background: rgba(8, 20, 35, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            padding: 8px 15px;
            margin-bottom: 20px;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
        }

        .input-bar input::placeholder {
            color: rgba(0, 240, 255, 0.4);
        }

        .btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: #00f0ff;
            border-radius: 20px;
            padding: 8px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .btn-mic {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            padding: 0;
            font-size: 1.1rem;
        }

        .btn-mic.recording {
            background: rgba(255, 50, 50, 0.4);
            border-color: #ff3232;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="header">
            <h1>J.A.R.V.I.S.</h1>
            <p id="status-text">• PRÊT •</p>
        </div>

        <div>
            <div class="chat-box" id="chat-box">
                <div class="chat-message" id="response-text">
                    Initialisation du système... Connexion à la galaxie de données en cours.
                </div>
            </div>

            <div class="input-bar">
                <button class="btn btn-mic" id="mic-btn" title="Activer le micro">🎙️</button>
                <input type="text" id="user-input" placeholder="Envoyer un message..." />
                <button class="btn" id="send-btn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SCÈNE 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lumières
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00f0ff, 2, 50);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // Noyau J.A.R.V.I.S.
        const coreGeometry = new THREE.SphereGeometry(2, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);

        const innerCoreGeom = new THREE.SphereGeometry(1.2, 32, 32);
        const innerCoreMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
        const innerCore = new THREE.Mesh(innerCoreGeom, innerCoreMat);
        scene.add(innerCore);

        // Groupe pour les nœuds (Planètes / Étoiles)
        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        const nodesMap = new Map();

        // --- 2. CRÉATION DES PLANÈTES ET ÉTOILES ---
        function createGalaxyNode(nodeData, index, total) {
            const angle = (index / total) * Math.PI * 2;
            const radius = 8 + Math.random() * 12;
            const height = (Math.random() - 0.5) * 6;

            let mesh;

            if (nodeData.type === 'spreadsheet' || (nodeData.mimeType && nodeData.mimeType.includes('spreadsheet'))) {
                // PLANÈTE (Google Sheets) -> Sphère vert émeraude avec anneau
                const geometry = new THREE.SphereGeometry(0.7, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x00ff88,
                    emissive: 0x004422,
                    roughness: 0.3,
                    metalness: 0.8
                });
                mesh = new THREE.Mesh(geometry, material);
                
                const ringGeom = new THREE.RingGeometry(0.9, 1.1, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, opacity: 0.5, transparent: true });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);
            } else {
                // ÉTOILE (Document / Autre) -> Octaèdre bleu cyan
                const geometry = new THREE.OctahedronGeometry(0.35);
                const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                mesh = new THREE.Mesh(geometry, material);
            }

            mesh.position.set(
                Math.cos(angle) * radius,
                height,
                Math.sin(angle) * radius
            );

            mesh.userData = { 
                id: nodeData.id, 
                name: nodeData.name, 
                type: nodeData.type,
                baseY: height,
                angle: angle,
                radius: radius
            };

            galaxyGroup.add(mesh);
            nodesMap.set(nodeData.id, mesh);
        }

        // --- 3. CHARGEMENT DE LA GALAXIE DEPUIS LE BACKEND ---
        async function loadGalaxy() {
            const responseText = document.getElementById('response-text');
            try {
                const res = await fetch('/api/galaxy');
                if (!res.ok) throw new Error("Erreur HTTP " + res.status);
                
                const data = await res.json();
                const nodes = (data && Array.isArray(data.nodes)) ? data.nodes : [];

                while(galaxyGroup.children.length > 0){ 
                    galaxyGroup.remove(galaxyGroup.children[0]); 
                }
                nodesMap.clear();

                if (nodes.length > 0) {
                    nodes.forEach((node, idx) => createGalaxyNode(node, idx, nodes.length));
                    responseText.innerText = "Galaxie connectée. Je suis à votre écoute.";
                } else {
                    throw new Error("Aucun nœud reçu");
                }
            } catch (err) {
                console.warn("Passage en mode démo galaxie :", err);
                while(galaxyGroup.children.length > 0){ 
                    galaxyGroup.remove(galaxyGroup.children[0]); 
                }
                nodesMap.clear();

                const fallbackNodes = [
                    { id: "s1", name: "DKB ERP", type: "spreadsheet" },
                    { id: "s2", name: "Suivi Revenus 2026", type: "spreadsheet" },
                    { id: "d1", name: "Note", type: "file" }
                ];
                fallbackNodes.forEach((node, idx) => createGalaxyNode(node, idx, fallbackNodes.length));
                responseText.innerText = "Système J.A.R.V.I.S. initialisé. Comment puis-je vous aider ?";
            }
        }

        loadGalaxy();

        // --- 4. ANIMATION 3D ---
        function animate() {
            requestAnimationFrame(animate);

            core.rotation.y += 0.005;
            core.rotation.x += 0.002;
            galaxyGroup.rotation.y += 0.0015;

            const time = Date.now() * 0.001;
            galaxyGroup.children.forEach(child => {
                if (child.userData.baseY !== undefined) {
                    child.position.y = child.userData.baseY + Math.sin(time + child.userData.angle) * 0.3;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // --- 5. SYNTHÈSE VOCALE (TEXT-TO-SPEECH) ---
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Stoppe toute lecture en cours

            // Nettoyage rapide du texte (enlever le markdown)
            const cleanText = text.replace(/[*_#`]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        // --- 6. RECONNAISSANCE VOCALE (SPEECH-TO-TEXT) ---
        const micBtn = document.getElementById('mic-btn');
        const userInput = document.getElementById('user-input');
        let recognition = null;
        let isListening = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                console.error("Erreur micro:", event.error);
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            micBtn.style.display = 'none'; // Masquer si non supporté
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('recording');
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                window.speechSynthesis.cancel(); // Coupe l'IA si elle parlait
                recognition.start();
            }
        });

        // --- 7. ENVOI DU MESSAGE & ENPOINT /CHAT ---
        const sendBtn = document.getElementById('send-btn');
        const responseText = document.getElementById('response-text');
        const statusText = document.getElementById('status-text');

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = '';
            responseText.innerText = "Traitement en cours...";
            statusText.innerText = "• RÉPONSE EN COURS •";

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await res.json();
                const reply = data.response || "Aucune réponse reçue.";
                
                responseText.innerText = reply;
                statusText.innerText = "• PRÊT •";

                // Synthèse vocale automatique de la réponse
                speakText(reply);

                // Animation de focus sur le nœud concerné
                if (data.source_node_ids && data.source_node_ids.length > 0) {
                    data.source_node_ids.forEach(id => {
                        const targetMesh = nodesMap.get(id);
                        if (targetMesh) {
                            targetMesh.scale.set(2.5, 2.5, 2.5);
                            setTimeout(() => targetMesh.scale.set(1, 1, 1), 2500);
                        }
                    });
                }

            } catch (err) {
                responseText.innerText = "Erreur de connexion au serveur.";
                statusText.innerText = "• ERREUR •";
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
