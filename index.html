<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Neural Knowledge Graph</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030710;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            pointer-events: none;
        }

        .header {
            margin-top: 10px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 6px;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
        }

        .header p {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #00f0ff;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Légende complète du HUD (Rétractable/Clean) */
        .legend-box {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(6, 16, 30, 0.82);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 12px;
            padding: 10px 14px;
            backdrop-filter: blur(12px);
            pointer-events: auto;
            font-size: 0.72rem;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.2);
            max-width: 220px;
        }

        .legend-title {
            color: #00f0ff;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.68rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 3px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }

        .chat-box {
            width: 92vw;
            max-width: 520px;
            background: rgba(6, 16, 30, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(12px);
            pointer-events: auto;
            max-height: 25vh;
            overflow-y: auto;
        }

        .chat-message {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e0f7fc;
            white-space: pre-wrap;
        }

        .input-bar {
            width: 92vw;
            max-width: 520px;
            display: flex;
            align-items: center;
            background: rgba(6, 16, 30, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 30px;
            padding: 4px 12px;
            margin-bottom: 10px;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px;
            font-size: 0.9rem;
        }

        .input-bar input::placeholder {
            color: rgba(0, 240, 255, 0.45);
        }

        .btn {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.6);
            color: #00f0ff;
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        .btn-mic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            padding: 0;
            font-size: 1rem;
        }

        .btn-mic.recording {
            background: rgba(255, 50, 50, 0.4);
            border-color: #ff3232;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.9);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.12); }
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-container">
        <!-- Légende complète (HUD) -->
        <div class="legend-box">
            <div class="legend-title">Écosystème JARVIS</div>
            <div class="legend-item"><div class="legend-color" style="background:#b026ff; color:#b026ff;"></div> Recherche Web / Live</div>
            <div class="legend-item"><div class="legend-color" style="background:#00ff88; color:#00ff88;"></div> Tableurs / ERP</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff4422; color:#ff4422;"></div> Gmail & Alerts</div>
            <div class="legend-item"><div class="legend-color" style="background:#00f0ff; color:#00f0ff;"></div> Docs / Fichiers</div>
            <div class="legend-item"><div class="legend-color" style="background:#ffcc00; color:#ffcc00;"></div> Code & Predictive AI</div>
        </div>

        <div class="header">
            <h1>J.A.R.V.I.S.</h1>
            <p id="status-text">• RÉSOMÉTRIE ACTIVE •</p>
        </div>

        <div>
            <div class="chat-box" id="chat-box">
                <div class="chat-message" id="response-text">
                    Système aligné. Cliquez sur un service/nœud pour lancer une analyse directe.
                </div>
            </div>

            <div class="input-bar">
                <button class="btn btn-mic" id="mic-btn" title="Microphone">🎙️</button>
                <input type="text" id="user-input" placeholder="Poser une question à JARVIS..." />
                <button class="btn" id="send-btn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. INITIALISATION DE LA SCÈNE 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030710, 0.01);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -2, 38);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lumières
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0x00f0ff, 2.5, 60);
        coreLight.position.set(0, 6, 0);
        scene.add(coreLight);

        // Groupe principal élevé au-dessus de la boîte de chat
        const mainWorld = new THREE.Group();
        mainWorld.position.y = 6;
        scene.add(mainWorld);

        // Noyau Central
        const coreGroup = new THREE.Group();
        mainWorld.add(coreGroup);

        const coreMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(2.2, 2),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true })
        );
        coreGroup.add(coreMesh);

        const innerMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff })
        );
        coreGroup.add(innerMesh);

        // Arrière-plan spatial
        const starsGeom = new THREE.BufferGeometry();
        const starPositions = new Float32Array(500 * 3);
        for(let i=0; i<500*3; i++) starPositions[i] = (Math.random() - 0.5) * 120;
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.15, transparent: true, opacity: 0.4 })));

        const galaxyGroup = new THREE.Group();
        const linesGroup = new THREE.Group();
        const lasersGroup = new THREE.Group();
        mainWorld.add(galaxyGroup);
        mainWorld.add(linesGroup);
        mainWorld.add(lasersGroup);

        const nodesMap = new Map();
        const nodeList = [];
        const animatedLines = [];

        // --- 2. GÉOMÉTRIES PAR TYPE DE SERVICE ---
        function createNodeMesh(type) {
            let mesh;
            
            if (type === 'web' || type === 'search') {
                // RECHERCHE WEB : Orbe violet/magenta vibrant avec anneau d'ondes
                const geom = new THREE.IcosahedronGeometry(0.9, 1);
                const mat = new THREE.MeshStandardMaterial({ color: 0xb026ff, emissive: 0x440088, roughness: 0.1, metalness: 0.9 });
                mesh = new THREE.Mesh(geom, mat);

                const waveGeom = new THREE.TorusGeometry(1.2, 0.04, 16, 32);
                const waveMat = new THREE.MeshBasicMaterial({ color: 0xb026ff, transparent: true, opacity: 0.7 });
                const wave = new THREE.Mesh(waveGeom, waveMat);
                wave.rotation.x = Math.PI / 2;
                mesh.add(wave);

            } else if (type === 'spreadsheet') {
                // GOOGLE SHEETS : Sphère émeraude avec anneau
                const geom = new THREE.SphereGeometry(0.85, 20, 20);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x004422, roughness: 0.2, metalness: 0.8 });
                mesh = new THREE.Mesh(geom, mat);
                const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.4, 20), new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);

            } else if (type === 'email' || type === 'gmail') {
                // GMAIL : Orbe rouge/orange
                const geom = new THREE.DodecahedronGeometry(0.7);
                const mat = new THREE.MeshBasicMaterial({ color: 0xff4422, wireframe: true });
                mesh = new THREE.Mesh(geom, mat);
                mesh.add(new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff6600 })));

            } else if (type === 'code' || type === 'ai') {
                // CODE / ENGINE : Octaèdre doré
                const geom = new THREE.OctahedronGeometry(0.75);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x665500 });
                mesh = new THREE.Mesh(geom, mat);

            } else {
                // DOCS & FICHIERS : Étoile cyan
                const geom = new THREE.OctahedronGeometry(0.6);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x006688 });
                mesh = new THREE.Mesh(geom, mat);
            }
            return mesh;
        }

        // --- 3. CONSTELLATIONS ET ANIMA TION DU FLUX ---
        function buildConstellationLines() {
            while(linesGroup.children.length > 0) linesGroup.remove(linesGroup.children[0]);
            animatedLines.length = 0;

            for (let i = 0; i < nodeList.length; i++) {
                for (let j = i + 1; j < nodeList.length; j++) {
                    const n1 = nodeList[i];
                    const n2 = nodeList[j];
                    const dist = n1.position.distanceTo(n2.position);

                    if (dist < 11 || (n1.userData.type === n2.userData.type && dist < 17)) {
                        const geometry = new THREE.BufferGeometry().setFromPoints([n1.position, n2.position]);
                        
                        const material = new THREE.LineDashedMaterial({
                            color: n1.userData.type === 'web' ? 0xb026ff : 0x00f0ff,
                            dashSize: 0.6,
                            gapSize: 0.4,
                            transparent: true,
                            opacity: 0.35
                        });

                        const line = new THREE.Line(geometry, material);
                        line.computeLineDistances();
                        linesGroup.add(line);
                        animatedLines.push(material);
                    }
                }
            }
        }

        // --- 4. CHARGEMENT ET DÉPLOIEMENT DES NŒUDS ---
        async function loadGalaxy() {
            const responseText = document.getElementById('response-text');
            try {
                const res = await fetch('/api/galaxy');
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                let nodes = (data && Array.isArray(data.nodes)) ? data.nodes : [];
                if (nodes.length === 0) throw new Error("Aucun nœud");
                renderNodes(nodes);
                responseText.innerText = `Matrice connectée : ${nodes.length} nœuds (Web Search, Sheets, Gmail, AI).`;
            } catch (err) {
                // Écosystème complet avec Web Search et Outils d'Analyse
                const fullEcosystemNodes = [
                    { id: "web_search", name: "Recherche Web en Direct", type: "web" },
                    { id: "s1", name: "DKB ERP - Financier 3", type: "spreadsheet" },
                    { id: "s2", name: "DKB ERP - DG3", type: "spreadsheet" },
                    { id: "s3", name: "Suivi Revenus 2026", type: "spreadsheet" },
                    { id: "m1", name: "Mail: Échec Build Render", type: "email" },
                    { id: "m2", name: "Mail: Claude Data Sharing", type: "email" },
                    { id: "m3", name: "Mail: Newsletter Zidane", type: "email" },
                    { id: "d1", name: "Doc: Spécifications API", type: "file" },
                    { id: "d2", name: "Doc: Script Video YouTube", type: "file" },
                    { id: "ai_code", name: "Moteur de Prédiction Grok", type: "ai" }
                ];
                renderNodes(fullEcosystemNodes);
                responseText.innerText = "Écosystème JARVIS prêt. Cliquez sur la planète Web Search ou un fichier pour lancer l'analyse.";
            }
        }

        function renderNodes(nodes) {
            while(galaxyGroup.children.length > 0) galaxyGroup.remove(galaxyGroup.children[0]);
            nodesMap.clear();
            nodeList.length = 0;

            const total = nodes.length;
            nodes.forEach((data, i) => {
                const mesh = createNodeMesh(data.type);
                const angle = (i / total) * Math.PI * 2;
                const radius = 10 + Math.random() * 9;
                const height = (Math.random() - 0.5) * 7;

                mesh.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
                mesh.userData = { id: data.id || `node_${i}`, name: data.name, type: data.type, baseY: height, angle: angle };

                galaxyGroup.add(mesh);
                nodesMap.set(mesh.userData.id, mesh);
                nodeList.push(mesh);
            });

            buildConstellationLines();
        }

        loadGalaxy();

        // --- 5. ANIMATION SPATIALE ET FLUX DE DONNÉES ---
        function animate() {
            requestAnimationFrame(animate);

            coreMesh.rotation.y += 0.008;
            coreMesh.rotation.x += 0.004;

            galaxyGroup.rotation.y += 0.0012;
            linesGroup.rotation.y += 0.0012;
            lasersGroup.rotation.y += 0.0012;

            const dashOffsetSpeed = Date.now() * 0.002;
            animatedLines.forEach(mat => { mat.dashOffset = -dashOffsetSpeed; });

            const time = Date.now() * 0.0012;
            nodeList.forEach(mesh => {
                if (mesh.userData.baseY !== undefined) {
                    mesh.position.y = mesh.userData.baseY + Math.sin(time + mesh.userData.angle) * 0.35;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // --- 6. INTERACTION ET CLIC SUR UN NŒUD ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('.chat-box') || event.target.closest('.input-bar') || event.target.closest('.legend-box')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeList, true);

            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                while (hitMesh.parent && hitMesh.parent !== galaxyGroup) hitMesh = hitMesh.parent;
                
                const data = hitMesh.userData;
                if (data && data.name) {
                    highlightSourceNodes([data.id]);
                    if (data.type === 'web') {
                        document.getElementById('user-input').value = "Effectue une recherche en ligne sur : ";
                    } else {
                        document.getElementById('user-input').value = `Analyse les données de "${data.name}"`;
                    }
                    responseText.innerText = `Nœud sélectionné : [${data.name}]\nComplétez la question et validez.`;
                }
            }
        });

        // --- 7. EFFET LASER EN CAS DE RECHERCHE ---
        function highlightSourceNodes(nodeIds) {
            while(lasersGroup.children.length > 0) lasersGroup.remove(lasersGroup.children[0]);

            nodeIds.forEach(id => {
                let targetMesh = nodesMap.get(id) || nodeList[Math.floor(Math.random() * nodeList.length)];

                if (targetMesh) {
                    targetMesh.scale.set(3.0, 3.0, 3.0);
                    
                    // Laser violet si recherche Web, laser cyan si fichier local
                    const laserColor = targetMesh.userData.type === 'web' ? 0xb026ff : 0x00f0ff;
                    const laserMaterial = new THREE.LineBasicMaterial({ color: laserColor, linewidth: 3 });
                    
                    const points = [new THREE.Vector3(0, 0, 0), targetMesh.position];
                    const laserGeom = new THREE.BufferGeometry().setFromPoints(points);
                    lasersGroup.add(new THREE.Line(laserGeom, laserMaterial));

                    setTimeout(() => {
                        targetMesh.scale.set(1, 1, 1);
                        while(lasersGroup.children.length > 0) lasersGroup.remove(lasersGroup.children[0]);
                    }, 4500);
                }
            });
        }

        // --- 8. VOICE & CHAT ---
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ''));
            utterance.lang = 'fr-FR';
            window.speechSynthesis.speak(utterance);
        }

        const micBtn = document.getElementById('mic-btn');
        const userInput = document.getElementById('user-input');
        let recognition = null, isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.onstart = () => { isListening = true; micBtn.classList.add('recording'); };
            recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; sendMessage(); };
            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        } else { micBtn.style.display = 'none'; }

        function stopListening() { isListening = false; micBtn.classList.remove('recording'); }
        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isListening) recognition.stop();
            else { window.speechSynthesis.cancel(); recognition.start(); }
        });

        const sendBtn = document.getElementById('send-btn');
        const responseText = document.getElementById('response-text');
        const statusText = document.getElementById('status-text');

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // Détection automatique de la recherche Web dans la requête pour illuminer l'orbe violet
            const isWebQuery = prompt.toLowerCase().includes('recherche') || prompt.toLowerCase().includes('web') || prompt.toLowerCase().includes('actu') || prompt.toLowerCase().includes('en ligne');
            if (isWebQuery) {
                highlightSourceNodes(['web_search']);
            }

            userInput.value = '';
            responseText.innerText = "Traitement en cours...";
            statusText.innerText = "• EXTRACTION NEURONALE •";

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await res.json();
                const reply = data.response || "Aucune réponse reçue.";
                responseText.innerText = reply;
                statusText.innerText = "• RÉSOMÉTRIE ACTIVE •";
                speakText(reply);

                if (data.source_node_ids) highlightSourceNodes(data.source_node_ids);
            } catch (err) {
                responseText.innerText = "Erreur de connexion au serveur.";
                statusText.innerText = "• ERREUR •";
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
