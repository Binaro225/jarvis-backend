<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>J.A.R.V.I.S.</title>
  <meta name="theme-color" content="#02060c" />
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #02060c;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function GalaxyCanvas() {
      const mountRef = useRef(null);

      useEffect(() => {
        const mount = mountRef.current;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        mount.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const count = 2000;
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i++) {
          positions[i] = (Math.random() - 0.5) * 10;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00f0ff });
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 5;

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          points.rotation.y += 0.002;
          points.rotation.x += 0.001;
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (mount && mount.contains(renderer.domElement)) {
            mount.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="absolute inset-0 z-0" />;
    }

    function JarvisApp() {
      const [input, setInput] = useState('');
      const [lastResponse, setLastResponse] = useState('Système prêt. Écoute continue active.');
      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      
      const recognitionRef = useRef(null);
      const isSpeakingRef = useRef(false);

      // Préchargement immédiat des voix du système pour éliminer la latence
      useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.getVoices();
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      }, []);

      useEffect(() => {
        isSpeakingRef.current = isSpeaking;
      }, [isSpeaking]);

      // Synthèse Vocale instantanée à vitesse normale
      const speak = (text, onComplete) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); // Annule tout retard accumulé
          
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'fr-FR';
          utterance.rate = 1.0; // Vitesse normale
          utterance.pitch = 1.0;
          
          utterance.onstart = () => setIsSpeaking(true);
          utterance.onend = () => {
            setIsSpeaking(false);
            if (onComplete) onComplete();
          };
          utterance.onerror = () => {
            setIsSpeaking(false);
            if (onComplete) onComplete();
          };

          // Lancement immédiat
          window.speechSynthesis.speak(utterance);
        } else if (onComplete) {
          onComplete();
        }
      };

      // Écoute permanente
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        const rec = new SpeechRecognition();
        rec.lang = 'fr-FR';
        rec.continuous = true;
        rec.interimResults = false;

        rec.onstart = () => setIsListening(true);
        rec.onend = () => {
          setIsListening(false);
          if (!isSpeakingRef.current) {
            try { rec.start(); } catch(e) {}
          }
        };

        rec.onresult = (event) => {
          const transcript = event.results[event.results.length - 1][0].transcript.trim();
          if (transcript) {
            setInput(transcript);
            sendMessage(transcript);
          }
        };

        recognitionRef.current = rec;
        try { rec.start(); } catch(e) {}

        return () => {
          if (recognitionRef.current) recognitionRef.current.stop();
        };
      }, []);

      const sendMessage = async (textToSend) => {
        const query = textToSend || input;
        if (!query.trim()) return;

        setInput('');
        setLastResponse("Analyse en cours...");

        if (recognitionRef.current) recognitionRef.current.stop();

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: query }),
          });

          if (response.ok) {
            const data = await response.json();
            const reply = data.response || data.message || "Opération terminée.";
            setLastResponse(reply);
            speak(reply, () => {
              try { recognitionRef.current.start(); } catch(e) {}
            });
          } else {
            const errText = "Erreur de communication avec le serveur backend.";
            setLastResponse(errText);
            speak(errText, () => {
              try { recognitionRef.current.start(); } catch(e) {}
            });
          }
        } catch (err) {
          const offlineText = "Impossible de contacter le serveur.";
          setLastResponse(offlineText);
          speak(offlineText, () => {
            try { recognitionRef.current.start(); } catch(e) {}
          });
        }
      };

      return (
        <div className="relative w-full h-screen text-cyan-400 flex flex-col justify-between p-6 z-10 select-none">
          <GalaxyCanvas />
          
          <header className="z-10 text-center mt-2">
            <h1 className="text-3xl font-bold tracking-[0.3em] text-cyan-300 drop-shadow-[0_0_12px_rgba(0,240,255,0.9)]">
              J.A.R.V.I.S.
            </h1>
            <p className="text-[11px] text-cyan-500 uppercase tracking-widest mt-1">
              {isSpeaking ? "• RÉPONSE EN COURS •" : isListening ? "• ÉCOUTE CONTINU •" : "• INITIALISATION •"}
            </p>
          </header>

          <main className="z-10 flex-1 flex flex-col items-center justify-center px-4">
            <div className={`w-36 h-36 rounded-full border-2 border-cyan-500/40 flex items-center justify-center transition-all duration-500 ${
              isSpeaking 
                ? 'scale-110 shadow-[0_0_50px_rgba(0,240,255,0.8)] border-cyan-300' 
                : isListening 
                ? 'scale-105 shadow-[0_0_35px_rgba(0,240,255,0.5)] border-cyan-400 animate-pulse' 
                : 'shadow-[0_0_25px_rgba(0,240,255,0.3)]'
            }`}>
              <div className="w-24 h-24 rounded-full border border-cyan-300/80 flex items-center justify-center">
                <div className={`w-12 h-12 rounded-full bg-cyan-400 shadow-[0_0_25px_#00f0ff] transition-all ${
                  isSpeaking ? 'bg-cyan-200 scale-125' : ''
                }`}></div>
              </div>
            </div>

            <div className="mt-8 max-w-md text-center">
              <p className="text-base font-medium tracking-wide text-cyan-200 drop-shadow-[0_0_8px_rgba(0,240,255,0.6)] leading-relaxed">
                {lastResponse}
              </p>
            </div>
          </main>

          <footer className="z-10 w-full max-w-md mx-auto bg-black/40 backdrop-blur-lg border border-cyan-500/30 rounded-full p-2 flex items-center gap-2 shadow-[0_0_20px_rgba(0,240,255,0.15)]">
            <div className={`p-3 rounded-full border transition-all ${
              isListening ? 'bg-cyan-500/30 border-cyan-400 text-cyan-200 animate-pulse' : 'bg-cyan-950/40 border-cyan-700 text-cyan-600'
            }`}>
              🎤
            </div>

            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
              placeholder="Parlez directement ou tapez..."
              className="w-full bg-transparent text-cyan-100 placeholder-cyan-600 outline-none px-3 text-sm"
            />

            <button
              onClick={() => sendMessage()}
              className="bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 px-5 py-2 rounded-full text-xs font-semibold tracking-wider uppercase"
            >
              Envoyer
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<JarvisApp />);
  </script>
</body>
</html>
