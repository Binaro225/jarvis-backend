<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>J.A.R.V.I.S.</title>
  <meta name="theme-color" content="#02060c" />
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #02060c;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- CDNs React, ReactDOM, Three.js et Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SCÈNE 3D GALAXY ---
    function GalaxyCanvas() {
      const mountRef = useRef(null);

      useEffect(() => {
        const mount = mountRef.current;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        mount.appendChild(renderer.domElement);

        // Particules 3D
        const geometry = new THREE.BufferGeometry();
        const count = 2000;
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i++) {
          positions[i] = (Math.random() - 0.5) * 10;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00f0ff });
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 5;

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          points.rotation.y += 0.002;
          points.rotation.x += 0.001;
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (mount.contains(renderer.domElement)) {
            mount.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="absolute inset-0 z-0" />;
    }

    // --- INTERFACE JARVIS ---
    function JarvisApp() {
      return (
        <div className="relative w-full h-screen text-cyan-400 flex flex-col items-center justify-between p-6 z-10 select-none">
          <GalaxyCanvas />
          
          <header className="z-10 text-center mt-4">
            <h1 className="text-3xl font-bold tracking-widest text-cyan-300 drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]">
              J.A.R.V.I.S.
            </h1>
            <p className="text-xs text-cyan-500 uppercase tracking-wider mt-1">Système Actif</p>
          </header>

          <main className="z-10 flex flex-col items-center justify-center my-auto">
            <div className="w-32 h-32 rounded-full border-2 border-cyan-500/40 flex items-center justify-center animate-pulse shadow-[0_0_30px_rgba(0,240,255,0.3)]">
              <div className="w-24 h-24 rounded-full border border-cyan-300/80 flex items-center justify-center">
                <div className="w-12 h-12 rounded-full bg-cyan-400 shadow-[0_0_20px_#00f0ff]"></div>
              </div>
            </div>
          </main>

          <footer className="z-10 w-full max-w-md bg-black/40 backdrop-blur-md border border-cyan-500/30 rounded-2xl p-3 flex items-center gap-2">
            <input 
              type="text" 
              placeholder="Commande système..." 
              className="w-full bg-transparent text-cyan-100 placeholder-cyan-600 outline-none px-3 py-1"
            />
            <button className="bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 px-4 py-2 rounded-xl text-sm font-semibold">
              Envoyer
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<JarvisApp />);
  </script>
</body>
</html>
